version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    # `/` covers the workflows in `.github/workflows`; composite actions are listed by directory.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # The ref of `dtolnay/rust-toolchain` is the Rust version it installs
      # (e.g. `@1.89.0`), not an action release, so bumping it changes the
      # toolchain and must be done deliberately alongside `rust-toolchain.toml`.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      # group updates for core GitHub Actions
      core-actions:
        patterns:
          - "actions/**"
      # Group assignment is first-match in definition order, so this catch-all
      # only collects updates not claimed by a group above and must stay last.
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Maintain dependencies for Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codespan:
        patterns:
          - "codespan"
          - "codespan-*"
      arkworks:
        patterns:
          - "ark-*"
      rustcrypto:
        patterns:
          - "p256"
          - "k256"
      # `acir` passes `serde_reflection` types into `serde_generate`, so both
      # must resolve to the same `serde-reflection` version that
      # `serde-generate` depends on; bumping either alone fails to compile.
      serde-codegen:
        patterns:
          - "serde-reflection"
          - "serde-generate"
      # Group assignment is first-match in definition order, so this catch-all
      # only collects updates not claimed by a group above and must stay last.
      # Note: 0.x bumps such as 0.4 -> 0.5 count as "minor" here even though
      # cargo treats them as breaking; CI still gates the grouped PR.
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    # Check the npm registry for updates every Monday
    schedule:
      interval: "weekly"
    # Must be at least `npmMinimalAgeGate` in `.yarnrc.yml` (1 week). Yarn
    # refuses versions younger than that gate, and when a grouped update hits
    # it Dependabot silently drops that package from the group while still
    # bumping the rest, e.g. bumping hardhat plugins without the `hardhat`
    # version they require as a peer dependency.
    cooldown:
      default-days: 7
    ignore:
      # @types/node major version matches Node.js major version
      # Keep compatible with our minimum supported Node version (22.x)
      - dependency-name: "@types/node"
        versions: [ ">=23.0.0" ]
      # Ignore updates for @aztec-foundation/bb.js as it's managed separately
      - dependency-name: "@aztec-foundation/bb.js"
    groups:
      # group updates for linter
      linter:
        patterns:
          - "eslint*"
          - "@eslint/**"
          - "@typescript-eslint/**"
          - "prettier"
      docusaurus:
        patterns:
          - "@docusaurus/**"
          - "docusaurus*"
      webpack:
        patterns:
          - "webpack"
          - "*-webpack-plugin"
      typedoc:
        patterns:
          - "typedoc*"
      react:
        patterns:
          - "react"
          - "react-dom"
      hardhat:
        patterns:
          - "hardhat"
          - "@nomicfoundation/hardhat*"
          - "ethers"
      testing:
        patterns:
          - "chai"
          - "@esm-bundle/chai"
          - "mocha*"
          - "sinon"
          - "@types/chai"
          - "@types/mocha*"
          - "@types/sinon"
      # Playwright's lockfile version drives the CI browser install and the
      # `mcr.microsoft.com/playwright` container image (both read it through
      # `scripts/playwright_version.sh`), so it gets its own PR rather than
      # riding along in the catch-all.
      playwright:
        patterns:
          - "*playwright*"
      # Group assignment is first-match in definition order, so this catch-all
      # only collects updates not claimed by a group above and must stay last.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
