  #         name: acvm-js
  #         path: ./acvm-repo/acvm_js

  #     - name: Download noir_wasm package artifact
  #       uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
  #       with:
  #         name: noir_wasm
  #         path: ./compiler/wasm

  #     - name: Download noirc_abi package artifact
  #       uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
  #       with:
  #         name: noirc_abi_wasm
  #         path: ./tooling/noirc_abi_wasm

  #     - name: Install Yarn dependencies
  #       uses: ./.github/actions/setup

  #     - uses: taiki-e/install-action@just

  #     - name: Install Playwright
  #       run: just install-playwright

  #     - name: Setup `integration-tests`
  #       run: |
  #         # Note the lack of spaces between package names.
  #         PACKAGES_TO_BUILD="@noir-lang/types,@noir-lang/noir_js"
  #         yarn workspaces foreach -Wvtp --from "{$PACKAGES_TO_BUILD}" run build

  #     - name: Run `integration-tests`
  #       working-directory: ./compiler/integration-tests
  #       run: |
  #         yarn test:browser

  test-examples:
    name: Example scripts
    runs-on: ubuntu-24.04
    needs: [build-binaries, build-acvm-js, build-noirc-abi, playwright-version]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.3

      - name: Install Yarn dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright
        uses: ./.github/actions/install-playwright
        with:
          playwright-version: ${{ needs.playwright-version.outputs.version }}

      - uses: taiki-e/install-action@just

      - name: Install `bb`
        run: |
          ./scripts/install_bb.sh
          echo "$HOME/.bb/" >> $GITHUB_PATH
          sudo apt-get install libc6 libstdc++6 -y

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Download noir-execute binary
        uses: ./.github/actions/download-binary
        with:
          name: noir-execute

      - name: Download noir-ssa binary
        uses: ./.github/actions/download-binary
        with:
          name: noir-ssa

      - name: Download noir-profiler binary
        uses: ./.github/actions/download-binary
        with:
          name: noir-profiler

      - name: Download acvm_js package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: acvm-js
          path: ./acvm-repo/acvm_js

      - name: Download noirc_abi package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: noirc_abi_wasm
          path: ./tooling/noirc_abi_wasm

      - name: Build noir_js
        # @noir-lang/types and @noir-lang/noir_js are pure TypeScript (tsc) and
        # don't need the wasm toolchain that `just build-package` installs via
        # install-js-tools; the wasm packages they depend on are downloaded as
        # prebuilt artifacts above. Build them directly to skip that install.
        run: |
          yarn workspace @noir-lang/types build
          yarn workspace @noir-lang/noir_js build

      - name: Run examples
        run: just run-examples

  test-nargo-doc:
    needs: [build-binaries]
    name: Nargo doc
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: nargo doc on stdlib
        working-directory: ./noir_stdlib
        run: |
          nargo doc
          rm -rf ./docs
          mv ./target/docs .
          if ! git diff --exit-code; then
            echo "nargo doc produced changes on noir_stdlib. Please run `just stdlib-doc`, then commit and push any changes."
            exit 1
          fi

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  tests-end:
    name: End
    runs-on: ubuntu-22.04
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - yarn-lock
      - test-acvm_js-node
      - test-acvm_js-browser
      - test-noirc-abi
      - test-noir-js
      - test-noir-wasm
      - test-noir-codegen
      - test-integration-node
      #- test-integration-browser
      - test-nargo-doc
      - test-examples
    permissions:
      contents: read

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # We treat any skipped or failing jobs as a failure for the workflow as a whole.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
