          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # On PRs, compare against the base branch measured in the same jobs: it ran on the same
          # machines, so the ratio doesn't depend on which runners the jobs landed on.
          external-data-json-path: ${{ needs.build-nargo-baseline.result == 'success' && './baseline_data.json' || '' }}
          alert-threshold: "120%"
          comment-on-alert: false
          # Without the base branch's results the comment would compare against the last master
          # commit, timed on another machine.
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') && needs.build-nargo-baseline.result == 'success' }}
          fail-on-alert: false
          max-items-in-chart: 50

  upload_brillig_artifact_reports:
    name: Upload Brillig artifact reports
    needs: [external_repo_reports, benchmark-projects-list]
    timeout-minutes: 5
    # We want this job to run even if one variation of the matrix in `external_repo_reports` fails
    # but only if there are benchmark projects to report on.
    if: ${{ always() && needs.benchmark-projects-list.outputs.has_projects == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download matrix compilation reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: external_report_*
          path: ./reports
          merge-multiple: true

      - name: Merge Brillig artifact size reports using jq
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar
          jq --slurp 'map(.brillig_artifact_size | select(.))' ./reports/* | tee artifact_size.json

      - name: Store benchmark result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "Brillig Artifact Size"
          tool: "customSmallerIsBetter"
          output-file-path: ./artifact_size.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          alert-threshold: "120%"
          comment-on-alert: false
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          fail-on-alert: false
          max-items-in-chart: 50

  upload_compilation_memory_report:
    name: Upload compilation memory report
    needs: [generate_memory_report, external_repo_memory_report, benchmark-projects-list]
    timeout-minutes: 5
    # We want this job to run even if one variation of the matrix in `external_repo_memory_report` fails
    # but only if there are benchmark projects to report on.
    if: ${{ always() && needs.benchmark-projects-list.outputs.has_projects == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download initial memory report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: in_progress_compilation_mem_report

      - name: Download matrix memory reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: compilation_mem_report_*
          path: ./reports
          merge-multiple: true

      - name: Merge memory reports using jq
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar
          jq --slurp '. | flatten' ./reports/* | tee memory_bench.json

      - name: Store benchmark result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "Compilation Memory"
          tool: "customSmallerIsBetter"
          output-file-path: ./memory_bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          alert-threshold: "120%"
          comment-on-alert: false
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          fail-on-alert: false
          max-items-in-chart: 50

  upload_execution_memory_report:
    name: Upload execution memory report
    needs: [generate_memory_report, external_repo_memory_report, benchmark-projects-list]
    timeout-minutes: 5
    # We want this job to run even if one variation of the matrix in `external_repo_memory_report` fails
    # but only if there are benchmark projects to report on.
    if: ${{ always() && needs.benchmark-projects-list.outputs.has_projects == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download initial memory report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: in_progress_execution_mem_report

      - name: Download matrix memory reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: execution_mem_report_*
          path: ./reports
          merge-multiple: true

      - name: Merge memory reports using jq
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar
          jq --slurp '. | flatten' ./reports/* | tee memory_bench.json

      - name: Store benchmark result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "Execution Memory"
          tool: "customSmallerIsBetter"
          output-file-path: ./memory_bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          alert-threshold: "120%"
          comment-on-alert: false
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') }}
          fail-on-alert: false
          max-items-in-chart: 50

  # The critical libraries whose test suites are timed (`timeout` above 20 seconds). The rest are
  # only checked for correctness, in `test-js-packages.yml`.
  timed-library-list:
    name: Load timed library list
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      libraries: ${{ steps.get_critical_libraries.outputs.libraries }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build list of libraries
        id: get_critical_libraries
        run: |
          LIBRARIES=$(.github/scripts/critical-library-list.sh timed)
          echo "libraries=$LIBRARIES"
          echo "libraries=$LIBRARIES" >> $GITHUB_OUTPUT

  external_repo_test_suites:
    needs: [build-nargo, build-nargo-baseline, timed-library-list, wake-bencher]
    # The test results don't depend on `build-nargo-baseline`, which only runs on PRs labelled
    # `bench-show` and only adds the base branch's timings. On pushes they run on the benchmark
    # machine, so they need `wake-bencher` to have succeeded rather than queueing for a machine
    # that may be off.
    if: >-
      ${{ !cancelled()
        && needs.build-nargo.result == 'success'
        && needs.timed-library-list.result == 'success'
        && (github.event_name != 'push' || needs.wake-bencher.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && fromJson('["self-hosted","noir-bench"]') || 'ubuntu-22.04' }}
    # Room for the base branch's run, which has its own limit below.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson( needs.timed-library-list.outputs.libraries )}}

    name: Time external repo tests - ${{ matrix.repo }}/${{ matrix.path }}
    env:
      OUTPUT_FILE: ${{ github.workspace }}/.github/critical_libraries_status/${{ matrix.repo }}/${{ matrix.path }}.actual.jsonl

    steps:
      # The benchmark machine keeps its workspace between jobs. Checkout's own clean removes the
      # previous job's files too, but only once a checkout succeeds; this also covers a job that
      # was cancelled or failed mid-checkout.
      - name: Clean workspace
        if: runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - name: Matrix Info
        run: |
          echo "repo: ${{ matrix.repo }}"
          echo "ref: ${{ matrix.ref }}"
          echo "path: ${{ matrix.path }}"
          echo "timeout: ${{ matrix.timeout }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: test-repo
          ref: ${{ matrix.ref }}

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Generate paths
        id: test_report_name
        run: |
          # Replace any slashes with underscores
          NAME=${NAME//\//_}
          TEST_REPORT_NAME=test_report_$NAME
          echo "test_report_name=$TEST_REPORT_NAME" >> $GITHUB_OUTPUT
        env:
          NAME: ${{ matrix.repo }}/${{ matrix.path }}

      - name: Run nargo test
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar

          .github/scripts/run-external-repo-tests.sh
        env:
          REPO_DIR: ./test-repo
          PROJECT_PATH: ${{ matrix.path }}
          NARGO_IGNORE_TEST_FAILURES_FROM_FOREIGN_CALLS: true
          NARGO_ARGS: ${{ matrix.nargo_args }}
          NAME: ${{ steps.test_report_name.outputs.test_report_name }}
          BENCHMARK_FILE: ${{ steps.test_report_name.outputs.test_report_name }}.json

      - name: Download baseline nargo binary
        if: needs.build-nargo-baseline.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nargo-baseline
          path: ${{ runner.temp }}/nargo-baseline

      # Runs after the PR's tests, so anything left warm by the first run can only favour the base.
      - name: Run nargo test with the base branch's nargo
        if: needs.build-nargo-baseline.result == 'success'
        # The base branch's results only add a comparison, so they never fail the library's checks,
        # and a base branch that hangs can't use up the job's time.
        continue-on-error: true
        timeout-minutes: 15
        run: |
          chmod +x "$NARGO"

          .github/scripts/run-external-repo-tests.sh

          # No test output means the base branch's nargo failed before running any tests, for example
          # on a library ref that needs the PR's compiler. Its time then isn't comparable.
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "::warning::The base branch's nargo didn't run the tests; not comparing their duration"
            rm -f "$BENCHMARK_FILE"
          fi
        env:
          NARGO: ${{ runner.temp }}/nargo-baseline/nargo
          REPO_DIR: ./test-repo
          PROJECT_PATH: ${{ matrix.path }}
          NARGO_IGNORE_TEST_FAILURES_FROM_FOREIGN_CALLS: true
          NARGO_ARGS: ${{ matrix.nargo_args }}
          NAME: ${{ steps.test_report_name.outputs.test_report_name }}
          # The base branch's results are only timed, not compared against the expected failures.
          OUTPUT_FILE: ${{ runner.temp }}/baseline_test_results.jsonl
          BENCHMARK_FILE: baseline_${{ steps.test_report_name.outputs.test_report_name }}.json

      - name: Upload baseline test report
        if: needs.build-nargo-baseline.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline_${{ steps.test_report_name.outputs.test_report_name }}
          path: baseline_${{ steps.test_report_name.outputs.test_report_name }}.json
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true

      - name: Compare test results
        run: .github/scripts/check_test_results.sh .github/critical_libraries_status/${{ matrix.repo }}/${{ matrix.path }}.failures.jsonl .github/critical_libraries_status/${{ matrix.repo }}/${{ matrix.path }}.actual.jsonl

      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.test_report_name.outputs.test_report_name }}
          path: ${{ steps.test_report_name.outputs.test_report_name }}.json
          retention-days: 3
          overwrite: true

      - name: Check test time limit
        run: |
          TIME=$(jq '.[0].value' ${{ steps.test_report_name.outputs.test_report_name }}.json)
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$TIME" "${{ matrix.timeout }}"; then
            # Don't bump this timeout without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to test suite exceeding timeout..."
            echo "Timeout: ${{ matrix.timeout }}"
            echo "Test suite took: $TIME".
            exit 1
          fi

  upload_test_suite_report:
    name: Upload test suite report
    needs: [external_repo_test_suites, build-nargo-baseline, timed-library-list]
    # We want this job to run even if one variation of the matrix in `external_repo_test_suites`
    # fails, but only if the libraries were loaded.
    if: ${{ always() && needs.timed-library-list.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download matrix test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test_report_*
          path: ./reports
          merge-multiple: true

      - name: Merge test reports using jq
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar
          jq --slurp '. | flatten' ./reports/* | tee test_bench.json

      - name: Download the base branch's test reports
        if: needs.build-nargo-baseline.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: baseline_test_report_*
          path: ./baseline_reports
          merge-multiple: true

      - name: Use the base branch's results as the previous ones
        if: needs.build-nargo-baseline.result == 'success'
        # A library whose baseline run failed has no report, so there may be none at all.
        run: |
          shopt -s nullglob
          .github/scripts/baseline-benchmark-data.sh "Test Suite Duration" "$BASE_SHA" "" ./baseline_reports/* > baseline_data.json
        env:
          BASE_SHA: ${{ needs.build-nargo-baseline.outputs.sha }}

      - name: Store benchmark result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "Test Suite Duration"
          tool: "customSmallerIsBetter"
          output-file-path: ./test_bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # On PRs, compare against the base branch measured in the same jobs: it ran on the same
          # machines, so the ratio doesn't depend on which runners the jobs landed on.
          external-data-json-path: ${{ needs.build-nargo-baseline.result == 'success' && './baseline_data.json' || '' }}
          alert-threshold: "120%"
          comment-on-alert: false
          # Without the base branch's results the comment would compare against the last master
          # commit, timed on another machine.
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') && needs.build-nargo-baseline.result == 'success' }}
          fail-on-alert: false
          max-items-in-chart: 50

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  reports-end:
    name: Report End
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - upload_test_suite_report
      - wake-bencher
      - rust_benchmarks
      - upload_compilation_reports
      - upload_elaboration_reports
      - upload_execution_reports
      - upload_artifact_reports
      - upload_opcode_reports
      - upload_brillig_compilation_reports
      - upload_brillig_execution_reports
      - upload_brillig_artifact_reports
      - upload_compilation_memory_report
      - upload_execution_memory_report

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # We treat any failing or cancelled jobs as a failure for the workflow as a whole.
          # Note: skipped is not treated as failure because upload jobs are intentionally skipped when there are no benchmark projects.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
