name: Reports

on:
  push:
    branches:
      - master
  pull_request:
    # `labeled` so that adding `bench-show` starts a run that times the PR against its base branch.
    # Any other label starts a run that does nothing (see the jobs' `if`).
    types: [opened, synchronize, reopened, labeled]

permissions: {}

# A new commit cancels the PR's previous run, and so does adding `bench-show`, which starts the
# run that times the PR against its base branch. Any other label gets a group of its own, so it
# cancels nothing; its run does nothing (see `gate`).
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'bench-show')) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides once what this run does; every root job depends on it.
  gate:
    name: Decide what to run
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      # `false` for a label other than `bench-show`: it changes nothing that is reported.
      run: ${{ github.event.action != 'labeled' || github.event.label.name == 'bench-show' }}
      # Only same-repo PRs labelled `bench-show` time the base branch next to the PR. External PRs
      # don't store benchmark results, so they have no use for the comparison.
      time_base: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'bench-show') && (github.event.action != 'labeled' || github.event.label.name == 'bench-show') }}
    steps:
      - name: Report the decision
        run: echo "run=${{ github.event.action != 'labeled' || github.event.label.name == 'bench-show' }}"

  rust_benchmarks:
    name: Rust Benchmarks
    needs: [gate, wake-bencher]
    # Like `external_repo_reports`: master pushes run on the benchmark machine, and PRs on a
    # GitHub-hosted runner, timing the base branch in the same job to compare against. A push whose
    # wake didn't succeed skips this rather than queueing for a machine that may be off.
    if: >-
      ${{ !cancelled()
        && needs.gate.outputs.run == 'true'
        && (github.event_name != 'push' || needs.wake-bencher.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && fromJson('["self-hosted","noir-bench"]') || 'ubuntu-22.04' }}

    # Timing the base branch runs the benchmarks four times.
    timeout-minutes: 45
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write
    env:
      TIME_BASE: ${{ needs.gate.outputs.time_base }}

    steps:
      # The benchmark machine keeps its workspace between jobs, including the worktrees below.
      - name: Clean workspace
        if: runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch is the merge commit's first parent.
          fetch-depth: 2

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The benchmark machine runs a newer distribution than the hosted runners, so its build
          # artifacts must not be restored on a hosted runner.
          key: x86_64-unknown-linux-gnu-bench-${{ runner.environment }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}

      # `target/criterion` must not survive from the cache or from the previous run: rust-cache's
      # cleanup can strip the files inside it while keeping the directories, and Criterion errors
      # mid-output on such a hollow baseline, which breaks the bencher-format parsing below.
      #
      # The base branch and the PR are timed in ABBA order (base, PR, PR, base) and each side's two
      # runs are averaged, so a runner that speeds up or slows down over the job shifts both sides
      # alike instead of favouring whichever ran first. Both are built from a worktree into the same
      # target directory, so they share the dependencies' build.
      - name: Run ACVM benchmarks against the base branch
        id: base
        if: env.TIME_BASE == 'true'
        # The base branch may fail to build or run where the PR doesn't; the PR's own results are
        # then timed by the next step and stored without a comparison.
        continue-on-error: true
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/acvm-base" HEAD^1
          git worktree add --detach "$RUNNER_TEMP/acvm-head" HEAD
          bench() {
            rm -rf target/criterion
            (cd "$RUNNER_TEMP/acvm-$1" && cargo bench -p acvm --target-dir "$GITHUB_WORKSPACE/target" -- --output-format bencher) | tee "acvm-bench-$1-$2.txt"
          }
          bench base 1
          bench head 1
          bench head 2
          bench base 2
          .github/scripts/average-cargo-bench.sh acvm-bench-head-1.txt acvm-bench-head-2.txt > acvm-bench.txt
          .github/scripts/average-cargo-bench.sh acvm-bench-base-1.txt acvm-bench-base-2.txt > acvm-bench-base.txt
          .github/scripts/cargo-bench-to-json.sh acvm-bench-base.txt > acvm-bench-base.json
          BENCH_TOOL=cargo .github/scripts/baseline-benchmark-data.sh "ACVM Benchmarks" "$(git rev-parse HEAD^1)" "" acvm-bench-base.json > baseline_data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ACVM benchmarks
        if: steps.base.outcome != 'success'
        shell: bash
        run: |
          rm -rf target/criterion
          cargo bench -p acvm -- --output-format bencher | tee acvm-bench.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store ACVM benchmarks result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "ACVM Benchmarks"
          tool: "cargo"
          output-file-path: ./acvm-bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # On PRs, compare against the base branch measured in the same job: it ran on the same
          # machine, so the ratio doesn't depend on which runner the job landed on.
          external-data-json-path: ${{ steps.base.outcome == 'success' && './baseline_data.json' || '' }}
          alert-threshold: "120%"
          comment-on-alert: false
          # Without the base branch's results the comment would compare against the last master
          # commit, timed on another machine.
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') && steps.base.outcome == 'success' }}
          fail-on-alert: false
          max-items-in-chart: 50

  benchmark-projects-list:
    name: Load benchmark projects list
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.get_bench_projects.outputs.projects }}
      has_projects: ${{ steps.get_bench_projects.outputs.has_projects }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build list of projects
        id: get_bench_projects
        run: |
          PROJECTS=$(yq ./.github/benchmark_projects.yml -o json | jq -c '(.projects // {}) | to_entries | map(.value + { name: .key })')
          echo "projects=$PROJECTS"
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          if [ "$PROJECTS" = "[]" ]; then
            echo "has_projects=false" >> $GITHUB_OUTPUT
          else
            echo "has_projects=true" >> $GITHUB_OUTPUT
          fi

  wake-bencher:
    name: Wake the benchmark machine
    # Pushes to master are timed on the dedicated benchmark machine, so master's history compares
    # like with like across commits. PRs stay on GitHub-hosted runners and compare against the base
    # branch timed in the same job instead (see `build-nargo-baseline`), so they don't queue on the
    # one machine.
    #
    # Started once the binaries exist, so the timed jobs are dispatched seconds after the wake,
    # before the machine can reach its idle cutoff. Its idle check counts a running Actions job as
    # busy, so it stays up once the first one starts.
    if: github.event_name == 'push'
    needs: [build-nargo, build-noir-inspector, benchmark-projects-list]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Exchanged for short-lived AWS credentials that can only start the benchmark machine.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/wake-bencher
          sparse-checkout-cone-mode: false

      - name: Wake the benchmark machine
        uses: ./.github/actions/wake-bencher

  build-nargo:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Noir repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Shared with `build-nargo-baseline`, which only runs on PRs and so never saves a cache.
          shared-key: nargo-release
          key: x86_64-unknown-linux-gnu
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Build Nargo
        run: cargo build --package nargo_cli --release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package artifacts
        run: |
          mkdir dist
          cp ./target/release/nargo ./dist/nargo

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nargo
          path: ./dist/*
          retention-days: 3

  # Builds the base branch's `nargo` so `external_repo_reports` can time it next to the PR's on the
  # same runner. The `upload_*` jobs for times then compare the PR against those results.
  #
  # It only reads the cache `build-nargo` saves on master. When a PR's base is behind master or the
  # cache was evicted, it builds from scratch, which costs about as long as `build-nargo` does cold.
  build-nargo-baseline:
    needs: [gate]
    if: needs.gate.outputs.time_base == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.build.outputs.sha }}

    steps:
      - name: Checkout Noir repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Build the base branch's nargo
        id: build
        uses: ./.github/actions/build-nargo-baseline
        with:
          shared-key: nargo-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nargo-baseline
          path: ./target/release/nargo
          retention-days: 3

  build-noir-inspector:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Noir repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-unknown-linux-gnu-inspector
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Build Nargo
        run: cargo build --package noir_inspector --release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package artifacts
        run: |
          mkdir dist
          cp ./target/release/noir-inspector ./dist/noir-inspector

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: noir-inspector
          path: ./dist/*
          retention-days: 3

  compare_gates_reports:
    name: Circuit sizes
    needs: [build-nargo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install `bb`
        run: |
          ./scripts/install_bb.sh
          echo "$HOME/.bb/" >> $GITHUB_PATH

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Build Noir circuits
        working-directory: ./test_programs
        run: ./rebuild.sh

      - name: Generate gates report
        working-directory: ./test_programs
        run: |
          ./gates_report.sh
          mv gates_report.json ../gates_report.json

      - name: Compare gates reports
        id: gates_diff
        uses: noir-lang/noir-gates-diff@4fbb881edf2977d43f44b1a877c235dda9e6e7ec
        with:
          report: gates_report.json
          summaryQuantile: 0.9 # only display the 10% most significant circuit size diffs in the summary (defaults to 20%)

      - name: Add gates diff to sticky comment
        # We don't run this step on external PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          # delete the comment in case changes no longer impact circuit sizes
          delete: ${{ !steps.gates_diff.outputs.markdown }}
          message: ${{ steps.gates_diff.outputs.markdown }}

  compare_brillig_bytecode_size_reports:
    name: Brillig bytecode sizes
    needs: [build-nargo]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Generate Brillig bytecode size report
        working-directory: ./test_programs
        run: |
          set -e

          mkdir ./reports

          ./gates_report_brillig.sh 9223372036854775807
          jq '.programs |= map(.package_name |= (. + "_inliner_max"))' gates_report_brillig.json > ./reports/gates_report_brillig_inliner_max.json

          ./gates_report_brillig.sh 0
          jq '.programs |= map(.package_name |= (. + "_inliner_zero"))' gates_report_brillig.json > ./reports/gates_report_brillig_inliner_zero.json

          ./gates_report_brillig.sh -9223372036854775808
          jq '.programs |= map(.package_name |= (. + "_inliner_min"))' gates_report_brillig.json > ./reports/gates_report_brillig_inliner_min.json

          # Merge all reports
          jq -s '{ programs: map(.programs) | add }' ./reports/* > ../gates_report_brillig.json

      - name: Compare Brillig bytecode size reports
        id: brillig_bytecode_diff
        uses: noir-lang/noir-gates-diff@4fbb881edf2977d43f44b1a877c235dda9e6e7ec
        with:
          report: gates_report_brillig.json
          header: |
            # Changes to Brillig bytecode sizes
          brillig_report: true
          summaryQuantile: 0.9 # only display the 10% most significant bytecode size diffs in the summary (defaults to 20%)

      - name: Add bytecode size diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: brillig
          # delete the comment in case changes no longer impact brillig bytecode sizes
          delete: ${{ !steps.brillig_bytecode_diff.outputs.markdown }}
          message: ${{ steps.brillig_bytecode_diff.outputs.markdown }}

  compare_brillig_execution_reports:
    name: Brillig execution trace sizes
    needs: [build-nargo]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Generate Brillig execution report
        working-directory: ./test_programs
        run: |
          set -e

          mkdir ./reports

          ./gates_report_brillig_execution.sh 9223372036854775807
          jq '.programs |= map(.package_name |= (. + "_inliner_max"))' gates_report_brillig_execution.json > ./reports/gates_report_brillig_execution_inliner_max.json

          ./gates_report_brillig_execution.sh 0
          jq '.programs |= map(.package_name |= (. + "_inliner_zero"))' gates_report_brillig_execution.json > ./reports/gates_report_brillig_execution_inliner_zero.json

          ./gates_report_brillig_execution.sh -9223372036854775808
          jq '.programs |= map(.package_name |= (. + "_inliner_min"))' gates_report_brillig_execution.json > ./reports/gates_report_brillig_execution_inliner_min.json

          # Merge all reports
          jq -s '{ programs: map(.programs) | add }' ./reports/* > ../gates_report_brillig_execution.json

      - name: Compare Brillig execution reports
        id: brillig_execution_diff
        uses: noir-lang/noir-gates-diff@4fbb881edf2977d43f44b1a877c235dda9e6e7ec
        with:
          report: gates_report_brillig_execution.json
          header: |
            # Changes to number of Brillig opcodes executed
          brillig_report: true
          summaryQuantile: 0.9 # only display the 10% most significant bytecode size diffs in the summary (defaults to 20%)

      - name: Add bytecode size diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: brillig_execution
          # delete the comment in case changes no longer impact brillig bytecode sizes
          delete: ${{ !steps.brillig_execution_diff.outputs.markdown }}
          message: ${{ steps.brillig_execution_diff.outputs.markdown }}

  generate_memory_report:
    name: Peak memory usage
    needs: [build-nargo]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Generate Memory report
        working-directory: ./test_programs
        run: |
          ./memory_report.sh
          mv memory_report.json ../memory_report.json

      - name: Upload compilation memory report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: in_progress_compilation_mem_report
          path: memory_report.json
          retention-days: 3
          overwrite: true

      - name: Generate execution memory report
        working-directory: ./test_programs
        run: |
          ./memory_report.sh 0 1
          mv memory_report.json ../memory_report.json

      - name: Upload execution memory report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: in_progress_execution_mem_report
          path: memory_report.json
          retention-days: 3
          overwrite: true

  external_repo_reports:
    needs: [build-nargo, build-nargo-baseline, build-noir-inspector, benchmark-projects-list, wake-bencher]
    # The reports don't depend on `build-nargo-baseline`, which is skipped outside of PRs and only
    # adds the base branch's timings. On pushes they run on the benchmark machine, so they need
    # `wake-bencher` to have succeeded rather than queueing for a machine that may be off.
    if: >-
      ${{ !cancelled()
        && needs.build-nargo.result == 'success'
        && needs.build-noir-inspector.result == 'success'
        && needs.benchmark-projects-list.result == 'success'
        && (github.event_name != 'push' || needs.wake-bencher.result == 'success') }}
    runs-on: ${{ github.event_name == 'push' && fromJson('["self-hosted","noir-bench"]') || 'ubuntu-22.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson( needs.benchmark-projects-list.outputs.projects )}}

    name: External repo compilation and execution reports - ${{ matrix.repo }}/${{ matrix.path }}
    steps:
      # The benchmark machine keeps its workspace between jobs. Checkout's own clean removes the
      # previous job's files too, but only once a checkout succeeds; this also covers a job that
      # was cancelled or failed mid-checkout.
      - name: Clean workspace
        if: runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/download-binary/action.yml
            scripts/gather_benchmark_data.sh
            scripts/process_benchmark_data.sh
          sparse-checkout-cone-mode: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: test-repo
          ref: ${{ matrix.ref }}

      - name: Download nargo binary
        uses: ./.github/actions/download-binary
        with:
          name: nargo

      - name: Download noir-inspector binary
        uses: ./.github/actions/download-binary
        with:
          name: noir-inspector

      - name: Download baseline nargo binary
        if: needs.build-nargo-baseline.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nargo-baseline
          path: ./nargo-baseline

      - name: Set baseline nargo binary
        if: needs.build-nargo-baseline.result == 'success'
        run: |
          chmod +x ./nargo-baseline/nargo
          echo "NARGO_BASELINE=${{ github.workspace }}/nargo-baseline/nargo" >> $GITHUB_ENV

      - name: Generate compilation report
        id: compilation_report
        run: |
          PACKAGE_NAME=$(basename ${{ matrix.path }})
          REPORT_NAME=external_report_$PACKAGE_NAME.json
          REPORT_PATH=$(pwd)/$REPORT_NAME

          echo "report_name=$REPORT_NAME" >> $GITHUB_OUTPUT
          echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT

      - name: Generate report data
        run: ./scripts/gather_benchmark_data.sh
        env:
          REPO_SLUG: ${{ matrix.repo }}
          PROJECT_TAG: ${{ matrix.ref }}
          REPO_DIR: test-repo
          PROJECT_DIR: ${{ matrix.path }}
          OUTPUT_DIR: ${{ github.workspace }}/output
          NUM_COMPILE_RUNS: ${{ matrix.num_compile_runs }}
          NUM_EXECUTE_RUNS: ${{ matrix.num_execute_runs }}
          SKIP_BRILLIG_EXECUTION: ${{ matrix.cannot_execute_brillig }}

      - name: Process report data
        run: |
          ./scripts/process_benchmark_data.sh $INPUT_DIR > ${{ steps.compilation_report.outputs.report_path }}
        env:
          INPUT_DIR: ${{ github.workspace }}/output
          PROJECT_NAME: ${{ matrix.name }}

      - name: Upload compilation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.compilation_report.outputs.report_name }}
          path: ${{ steps.compilation_report.outputs.report_path }}
          retention-days: 3
          overwrite: true

      - name: Check compilation time limit
        run: |
          TIME=$(jq '.compilation_time.value' ${{ steps.compilation_report.outputs.report_path }})
          TIME_LIMIT=${{ matrix.compilation-timeout }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$TIME" "$TIME_LIMIT"; then
            # Don't bump this timeout without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to compilation exceeding timeout..."
            echo "Timeout: "$TIME_LIMIT"s"
            echo "Compilation took: "$TIME"s".
            exit 1
          fi

      - name: Check execution time limit
        if: ${{ !matrix.cannot_execute }}
        run: |
          TIME=$(jq '.execution_time.value' ${{ steps.compilation_report.outputs.report_path }})
          TIME_LIMIT=${{ matrix.execution-timeout }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$TIME" "$TIME_LIMIT"; then
            # Don't bump this timeout without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to execution exceeding timeout..."
            echo "Timeout: "$TIME_LIMIT"s"
            echo "Execution took: "$TIME"s".
            exit 1
          fi

      - name: Check Brillig compilation time limit
        run: |
          TIME=$(jq '.brillig_compilation_time.value' ${{ steps.compilation_report.outputs.report_path }})
          TIME_LIMIT=${{ matrix.brillig-compilation-timeout }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$TIME" "$TIME_LIMIT"; then
            # Don't bump this timeout without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to Brillig compilation exceeding timeout..."
            echo "Timeout: "$TIME_LIMIT"s"
            echo "Brillig compilation took: "$TIME"s".
            exit 1
          fi

      - name: Check Brillig execution time limit
        if: ${{ !matrix.cannot_execute_brillig }}
        run: |
          TIME=$(jq '.brillig_execution_time.value' ${{ steps.compilation_report.outputs.report_path }})
          TIME_LIMIT=${{ matrix.brillig-execution-timeout }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$TIME" "$TIME_LIMIT"; then
            # Don't bump this timeout without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to Brillig execution exceeding timeout..."
            echo "Timeout: "$TIME_LIMIT"s"
            echo "Brillig execution took: "$TIME"s".
            exit 1
          fi

  external_repo_memory_report:
    needs: [build-nargo, benchmark-projects-list]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson( needs.benchmark-projects-list.outputs.projects )}}

    name: External repo memory report - ${{ matrix.repo }}/${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Note that we are checking them out under `scripts`, including the github action.
          path: scripts
          sparse-checkout: |
            .github/actions/download-binary/action.yml
            test_programs/memory_report.sh
            test_programs/parse_memory.sh
          sparse-checkout-cone-mode: false

      - name: Download nargo binary
        uses: ./scripts/.github/actions/download-binary
        with:
          name: nargo

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: test-repo
          ref: ${{ matrix.ref }}

      - name: Generate compilation memory report
        id: compilation_report
        working-directory: ./test-repo/${{ matrix.path }}
        run: |
          mv /home/runner/work/noir/noir/scripts/test_programs/memory_report.sh ./memory_report.sh
          mv /home/runner/work/noir/noir/scripts/test_programs/parse_memory.sh ./parse_memory.sh
          ./memory_report.sh 1

          # Rename the memory report as the execution report is about to write to the same file
          PACKAGE_NAME=${{ matrix.path }}
          PACKAGE_NAME=$(basename $PACKAGE_NAME)
          REPORT_NAME=compilation_mem_report_$PACKAGE_NAME.json
          REPORT_PATH=$(pwd)/$REPORT_NAME
          mv ./memory_report.json $REPORT_PATH

          echo "report_name=$REPORT_NAME" >> $GITHUB_OUTPUT
          echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT
        env:
          FLAGS: ${{ matrix.flags }}

      - name: Upload compilation memory report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.compilation_report.outputs.report_name }}
          path: ${{ steps.compilation_report.outputs.report_path }}
          retention-days: 3
          overwrite: true

      - name: Generate execution memory report
        id: execution_report
        working-directory: ./test-repo/${{ matrix.path }}
        if: ${{ !matrix.cannot_execute }}
        run: |
          ./memory_report.sh 1 1

          PACKAGE_NAME=${{ matrix.path }}
          PACKAGE_NAME=$(basename $PACKAGE_NAME)
          REPORT_NAME=execution_mem_report_$PACKAGE_NAME.json
          REPORT_PATH=$(pwd)/$REPORT_NAME
          mv ./memory_report.json $REPORT_PATH

          echo "report_name=$REPORT_NAME" >> $GITHUB_OUTPUT
          echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT

      - name: Upload execution memory report
        if: ${{ !matrix.cannot_execute }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.execution_report.outputs.report_name }}
          path: ${{ steps.execution_report.outputs.report_path }}
          retention-days: 3
          overwrite: true

      - name: Check compilation memory limit
        run: |
          MEMORY=$(jq '.[0].value' ${{ steps.compilation_report.outputs.report_path }})
          MEMORY_LIMIT=${{ matrix.compilation-memory-limit }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$MEMORY" "$MEMORY_LIMIT"; then
            # Don't bump this limit without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to compilation exceeding memory limit..."
            echo "Limit: "$MEMORY_LIMIT"MB"
            echo "Compilation took: "$MEMORY"MB".
            exit 1
          fi

      - name: Check execution memory limit
        if: ${{ !matrix.cannot_execute }}
        run: |
          MEMORY=$(jq '.[0].value' ${{ steps.execution_report.outputs.report_path }})
          MEMORY_LIMIT=${{ matrix.execution-memory-limit }}
          if awk 'BEGIN{exit !(ARGV[1]>ARGV[2])}' "$MEMORY" "$MEMORY_LIMIT"; then
            # Don't bump this limit without understanding why this has happened and confirming that you're not the cause.
            echo "Failing due to execution exceeding memory limit..."
            echo "Limit: "$MEMORY_LIMIT"MB"
            echo "Execution took: "$MEMORY"MB".
            exit 1
          fi

  upload_compilation_reports:
    name: Upload compilation reports
    needs: [external_repo_reports, build-nargo-baseline, benchmark-projects-list]
    timeout-minutes: 5
    # We want this job to run even if one variation of the matrix in `external_repo_reports` fails
    # but only if there are benchmark projects to report on.
    if: ${{ always() && needs.benchmark-projects-list.outputs.has_projects == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download matrix compilation reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: external_report_*
          path: ./reports
          merge-multiple: true

      - name: Merge compilation reports using jq
        run: |
          # Github actions seems to not expand "**" in globs by default.
          shopt -s globstar
          jq --slurp 'map(.compilation_time | select(.))' ./reports/* | tee time_bench.json

      - name: Use the base branch's results as the previous ones
        if: needs.build-nargo-baseline.result == 'success'
        run: .github/scripts/baseline-benchmark-data.sh "Compilation Time" "$BASE_SHA" baseline_compilation_time ./reports/* > baseline_data.json
        env:
          BASE_SHA: ${{ needs.build-nargo-baseline.outputs.sha }}

      - name: Store benchmark result
        # We don't run this step on external PRs
        if: github.ref == 'refs/heads/master' || github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: "Compilation Time"
          tool: "customSmallerIsBetter"
          output-file-path: ./time_bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Shallow-clone the gh-pages branch rather than fetching its full history, which is too large to fetch within the job timeout.
          gh-repository: "github.com/${{ github.repository }}"
          # We want this to only run on master to avoid garbage data from PRs being added.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # On PRs, compare against the base branch measured in the same jobs: it ran on the same
          # machines, so the ratio doesn't depend on which runners the jobs landed on.
          external-data-json-path: ${{ needs.build-nargo-baseline.result == 'success' && './baseline_data.json' || '' }}
          alert-threshold: "120%"
          comment-on-alert: false
          # Without the base branch's results the comment would compare against the last master
          # commit, timed on another machine.
          comment-always: ${{ contains( github.event.pull_request.labels.*.name, 'bench-show') && needs.build-nargo-baseline.result == 'success' }}
          fail-on-alert: false
          max-items-in-chart: 50

