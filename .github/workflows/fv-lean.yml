name: FV Lean

on:
  pull_request:
    paths:
      - "fv/**"
      - "compiler/noirc_evaluator/src/acir/acir_context/**"
      - ".github/workflows/fv-lean.yml"
  push:
    branches:
      - master
    paths:
      - "fv/**"
      - "compiler/noirc_evaluator/src/acir/acir_context/**"
      - ".github/workflows/fv-lean.yml"

permissions: {}

# This will cancel previous runs when a branch or PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  acir-lean:
    name: ACIR gadget proofs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL -o elan.tar.gz "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          rm elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build proofs and check the golden file
        working-directory: fv/acir_lean
        run: ./scripts/check.sh
