name: Install Playwright
description: Install Playwright browsers with caching for faster CI runs

inputs:
  browsers:
    description: 'Space-separated list of browsers to install (e.g. "chromium" or "chromium webkit")'
    required: false
    default: 'chromium'
  playwright-version:
    # No default: the browsers must match the driver `yarn install` puts in
    # node_modules, and only the caller knows which checkout's lockfile that is.
    # `scripts/playwright_version.sh` reads it out of yarn.lock.
    description: "Playwright version to install, as resolved by scripts/playwright_version.sh"
    required: true

runs:
  using: composite
  steps:
    # `required: true` on a composite action's input is documentation, not
    # enforcement: a caller that omits it gets an empty string here. Empty would
    # leave `playwright@` on the npx line below, which npm reads as `*` and
    # installs whatever the registry published latest, against whatever driver
    # `yarn install` put in node_modules. Refuse it before the cache key is
    # built from it.
    - name: Check the Playwright version is set
      shell: bash
      env:
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
      run: |
        set -euo pipefail
        if [[ ! "$PLAYWRIGHT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "install-playwright: playwright-version is '$PLAYWRIGHT_VERSION', not a version." >&2
            echo "Callers resolve it with scripts/playwright_version.sh and pass it in." >&2
            exit 1
        fi

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.playwright-version }}-${{ inputs.browsers }}-${{ runner.os }}

    # Composite-action steps do not support `timeout-minutes`, so each `npx` call
    # is bounded with coreutils `timeout`: a stalled download or apt mirror fails
    # fast (exit 124) and the retry wrapper takes a fresh, near-independent draw
    # rather than hanging until the job-level limit.
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/retry
      with:
        run: timeout 240 npx -y playwright@${{ inputs.playwright-version }} install ${{ inputs.browsers }}

    # GitHub-hosted Ubuntu runner images already ship Chromium's system
    # libraries, so `install-deps` is only needed for engines like WebKit.
    # Running it otherwise is a pure apt round-trip against the Azure-hosted
    # Ubuntu mirrors — the slowest and flakiest part of this action — so skip it
    # for chromium-only installs.
    #
    # Failures here are best-effort rather than fatal: this is `apt-get` under
    # the hood, and mirror congestion is a persistent (not transient) condition,
    # so the retry wrapper's "near-independent draw" assumption does not hold —
    # all attempts in the same window hit the same slow mirror. A genuinely
    # missing library surfaces loudly at browser-launch time anyway, whereas a
    # congested mirror should not red the whole build, so we run once and warn.
    - name: Install Playwright system dependencies
      if: contains(inputs.browsers, 'webkit') || contains(inputs.browsers, 'firefox')
      shell: bash
      env:
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        timeout 120 npx -y "playwright@${PLAYWRIGHT_VERSION}" install-deps ${BROWSERS} \
          || echo "::warning::playwright install-deps failed; continuing (browser launch will fail later if a library is genuinely missing)"
